market_research:
  description: >
    Execute a comprehensive scan of current trends, audience pain points, and news regarding {research_topic}. Extract 3-5 major insights relevant to {target_audience}.
  expected_output: >
    A structured report detailing 3-5 verified trends and actionable insights tailored for {target_audience}.
  agent: research_agent

content_selection:
  description: >
    Review the market research report. Select the single strongest narrative angle that aligns with the {brand_tone} brand identity.
  expected_output: >
    A one-page brief outlining the chosen narrative angle, key messaging points, and the rationale for its selection.
  agent: content_selection_agent

editorial_planning:
  description: >
    Transform the selected narrative into a specific post strategy. Define the hook, the core message, the Call to Action (CTA), and the visual concept.
  expected_output: >
    A detailed post blueprint outlining the hook, body outline, CTA, and visual instructions.
  agent: editorial_planning_agent

content_creation:
  description: >
    Create Instagram-ready content related to {research_topic}, including: 
    - engaging captions 
    - hashtags 
    - CTA 
    - visual concept 
    - AI image generation prompt 
    Use the image generation tool whenever visual content is needed.
  expected_output: >
    A complete Instagram post package containing: 
    - caption 
    - hashtags 
    - image prompt 
    - generated image URL
  agent: content_creation_agent

content_review:
  description: >
    Review the caption and image concept. Correct any grammatical errors, refine the tone to strictly match {brand_tone}, and verify the hashtags are optimal.
  expected_output: >
    The finalized, error-free caption and confirmation of the visual asset.
  agent: review_agent

image_hosting:
  description: >
    Locate the generated image file path from the content_creation task output. 
    Use the Image Hosting Tool to upload it to ImgBB. 
    Return the generated public URL clearly in your response.
  expected_output: >
    The direct, publicly accessible ImgBB image URL (e.g., https://i.ibb.co/...).
  agent: image_hosting_agent

instagram_publishing:
  description: >
    Read the task context carefully:
    1. Extract the public image URL from the image_hosting task output.
    2. Extract the finalized caption text from the content_review task output.

    You MUST execute the "Instagram API Tool" using these two extracted values as parameters. 
    Do NOT ask for input or respond conversationally without calling the tool.
  expected_output: >
    The confirmation message or API response string returned directly by the Instagram API Tool.
  agent: instagram_publishing_agent

monitoring_and_analysis:
  description: >
    Analyze the API publication response. Verify if the post was successful. If successful, outline a framework for tracking its first 24-hour engagement metrics.
  expected_output: >
    A post-deployment health check report detailing the API success/failure status and the recommended engagement monitoring plan.
  agent: monitoring_agent

strategy_learning:
  description: >
    Review the entire lifecycle of the campaign: from initial research to the final API deployment and initial monitoring report. Identify what worked and what needs improvement.
  expected_output: >
    A comprehensive optimization report containing actionable recommendations for the next cycle.
  agent: learning_agent
